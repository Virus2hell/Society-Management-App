# Render "Blueprint": deploys the backend API from this repository.
# Render dashboard -> New -> Blueprint -> pick your GitHub repo.
# You'll be asked for DATABASE_URL (paste your Neon connection string).
services:
  - type: web
    name: society-api
    runtime: node
    plan: free
    region: singapore          # closest Render region to India
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false            # you paste it in the dashboard, never in git
      - key: JWT_SECRET
        generateValue: true    # Render creates a random secret
      - key: SEED_DEMO
        value: "true"          # demo society so interviewers can try the app
